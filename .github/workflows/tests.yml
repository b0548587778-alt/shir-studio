name: tests
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libsndfile1 libportaudio2 fonts-dejavu-core
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Tests
        run: python -m pytest -q tests
      - name: Self test (the same one the installer build runs)
        timeout-minutes: 8
        # בשרת הבדיקות אין כרטיס קול, לכן רק טעינת כרטיס הקול מדולגת; כל השאר רץ כמו בבניית קובץ ההתקנה
        run: python -c "import sys, types; sys.modules['sounddevice'] = types.ModuleType('sounddevice'); from shir_studio.__main__ import selftest; selftest()"
